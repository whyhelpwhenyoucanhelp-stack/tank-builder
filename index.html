<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WW2 Tank Workshop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪖</text></svg>">
<style>
body {
  margin: 0; overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0a0a0a;
}

#startMenu {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 50%, #0a0a0a 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; overflow: hidden;
}

.menu-slider { display: flex; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); width: 90%; max-width: 500px; }
.menu-slide { min-width: 100%; opacity: 0; transform: scale(0.9); transition: all 0.5s ease; }
.menu-slide.active { opacity: 1; transform: scale(1); }
.menu-content { text-align: center; color: white; padding: 20px; }
.logo-tank { font-size: 60px; animation: float 3s ease-in-out infinite; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

.title-glow {
  font-size: 40px; font-weight: 900; letter-spacing: 4px; line-height: 1.1;
  text-shadow: 0 0 20px rgba(255,100,50,0.8), 0 0 40px rgba(255,60,20,0.6);
  animation: glowPulse 2s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { text-shadow: 0 0 20px rgba(255,100,50,0.8); }
  50% { text-shadow: 0 0 30px rgba(255,150,50,1), 0 0 60px rgba(255,100,20,0.9); }
}

.divider { width: 80px; height: 3px; background: linear-gradient(90deg, transparent, #e63946, transparent); margin: 16px auto; border-radius: 2px; }
.credit { font-size: 18px; margin: 6px 0; color: #ddd; }
.credit span { color: #e63946; font-weight: bold; }
.assist { font-size: 13px; margin: 4px 0; color: #aaa; }
.assist span { color: #ff6b6b; }
.tagline { font-size: 11px; color: #666; margin-top: 8px; font-style: italic; letter-spacing: 2px; }
.menu-content h2 { font-size: 28px; color: #e63946; letter-spacing: 3px; margin-bottom: 20px; }
.controls-list { text-align: left; max-width: 320px; margin: 0 auto; }

.control-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: rgba(255,255,255,0.05);
  border-radius: 8px; margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,0.08); color: #ddd;
}

.key-icon { font-size: 22px; }

.enter-btn, .music-btn {
  margin-top: 12px; padding: 12px 36px; font-size: 16px;
  background: linear-gradient(135deg, #8b0000, #b22222);
  color: white; border: 2px solid #ff4444; border-radius: 6px;
  cursor: pointer; letter-spacing: 2px; font-weight: bold; transition: all 0.3s;
  width: auto;
}

.enter-btn:hover, .music-btn:hover {
  background: linear-gradient(135deg, #a00000, #cc3333);
  box-shadow: 0 0 30px rgba(255,50,50,0.6); transform: scale(1.05);
}

.pulse { animation: btnPulse 2s infinite; }

@keyframes btnPulse {
  0%, 100% { box-shadow: 0 0 10px rgba(255,50,50,0.4); }
  50% { box-shadow: 0 0 30px rgba(255,50,50,0.9); }
}

.nav-arrows { display: flex; align-items: center; gap: 20px; margin-top: 30px; }
.nav-arrow {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
  color: white; font-size: 20px; padding: 10px 18px; border-radius: 50%; cursor: pointer; transition: all 0.3s;
}
.nav-arrow:hover { background: rgba(230,57,70,0.5); border-color: #e63946; box-shadow: 0 0 15px rgba(230,57,70,0.5); }
.slide-dots { display: flex; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s; }
.dot.active { background: #e63946; box-shadow: 0 0 10px #e63946; width: 28px; border-radius: 10px; }
.particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

.particle {
  position: absolute; width: 2px; height: 2px; background: #e63946;
  border-radius: 50%; animation: particleFloat 4s ease-in infinite; opacity: 0;
}

@keyframes particleFloat {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  20% { opacity: 1; } 80% { opacity: 1; }
  100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
}

#ui {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,0.85); color: white;
  padding: 14px; width: 280px; border-radius: 10px;
  z-index: 10; display: none;
  border: 1px solid rgba(255,255,255,0.15);
  max-height: 95vh; overflow-y: auto;
}

#ui h2 { margin: 0 0 10px 0; font-size: 15px; letter-spacing: 1px; color: #ff6b6b; }
select { width: 100%; margin-bottom: 6px; padding: 5px; background: #1a1a1a; color: white; border: 1px solid #444; border-radius: 4px; font-size: 12px; font-family: inherit; }
label { font-size: 11px; color: #aaa; display: block; margin-top: 4px; margin-bottom: 2px; }

#stats, #hoi4stats { font-size: 11px; line-height: 1.4; color: #ddd; }
#hoi4stats { color: #ffcc00; }

#createTank { width: 100%; margin-top: 8px; }

#specSheet {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.95); color: white; padding: 24px;
  border-radius: 12px; z-index: 200; max-width: 400px; max-height: 80vh; overflow-y: auto;
  border: 2px solid #e63946;
}
#specContent { font-size: 13px; line-height: 1.5; }
#specContent h3 { color: #ff6b6b; margin-bottom: 8px; }
</style>
</head>
<body>

<iframe id="bgMusic" style="display:none" allow="autoplay"></iframe>

<div id="startMenu">
  <div class="menu-slider" id="menuSlider">
    <div class="menu-slide active" data-slide="0">
      <div class="menu-content">
        <div class="logo-tank">🪖</div>
        <h1 class="title-glow">WW2<br>TANK<br>WORKSHOP</h1>
        <div class="divider"></div>
        <p class="credit">Created by <span>Amine Guerbi</span></p>
        <p class="assist">Assisted by <span>ChatGPT</span> & <span>Deep Seek</span></p>
        <p class="tagline">hate it or love it 🎵</p>
      </div>
    </div>
    <div class="menu-slide" data-slide="1">
      <div class="menu-content">
        <h2>🛠️ WORKSHOP MODE</h2>
        <div class="controls-list">
          <div class="control-item"><span class="key-icon">🔧</span><span>Build your dream tank</span></div>
          <div class="control-item"><span class="key-icon">📊</span><span>Stats update live</span></div>
          <div class="control-item"><span class="key-icon">📋</span><span>Create Tank = full spec sheet</span></div>
          <div class="control-item"><span class="key-icon">🖱️</span><span>Drag to rotate / PgUp PgDn zoom</span></div>
        </div>
      </div>
    </div>
    <div class="menu-slide" data-slide="2">
      <div class="menu-content">
        <h2>🎵 MUSIC</h2>
        <p style="color:#aaa;">WW2 atmosphere enabled</p>
        <button class="music-btn" id="toggleMusic">🔇 Mute / 🔊 Unmute</button>
        <br><br>
        <button class="enter-btn pulse" id="startButton">⚔️ ENTER WORKSHOP ⚔️</button>
      </div>
    </div>
  </div>
  <div class="nav-arrows">
    <button class="nav-arrow left" id="prevSlide">◀</button>
    <div class="slide-dots" id="slideDots">
      <span class="dot active" data-index="0"></span><span class="dot" data-index="1"></span><span class="dot" data-index="2"></span>
    </div>
    <button class="nav-arrow right" id="nextSlide">▶</button>
  </div>
  <div class="particles" id="particles"></div>
</div>

<div id="ui">
  <h2>🪖 WW2 TANK WORKSHOP</h2>
  <label>🚛 CHASSIS</label>
  <select id="chassis" onchange="updateAll()">
    <option value="light">Light Tank (Pz II)</option>
    <option value="medium" selected>Medium Tank (Pz IV)</option>
    <option value="heavy">Heavy Tank (Tiger I)</option>
    <option value="superheavy">Super Heavy (Maus)</option>
    <option value="td">Tank Destroyer (StuG)</option>
    <option value="spg">SPG (Wespe)</option>
  </select>
  <label>🏰 TURRET</label>
  <select id="turret" onchange="updateAll()">
    <option value="none">No Turret (Fixed Gun)</option>
    <option value="light" selected>Light Turret</option>
    <option value="medium">Medium Turret</option>
    <option value="heavy">Heavy Turret</option>
    <option value="aa">Anti-Air Turret</option>
  </select>
  <label>🔫 PRIMARY WEAPON</label>
  <select id="primaryWeapon" onchange="updateAll()">
    <option value="20mm">20mm Auto Cannon</option>
    <option value="37mm">37mm Cannon</option>
    <option value="50mm">50mm Cannon</option>
    <option value="75mm" selected>75mm Cannon</option>
    <option value="88mm">88mm Cannon</option>
    <option value="105mm">105mm Howitzer</option>
    <option value="128mm">128mm Heavy Cannon</option>
    <option value="150mm">150mm Siege Gun</option>
  </select>
  <label>🔫 SECONDARY 1</label>
  <select id="secondary1" onchange="updateAll()">
    <option value="none" selected>None</option>
    <option value="mg34">MG34 (Coaxial)</option>
    <option value="mg42">MG42 (Hull Mount)</option>
    <option value="flame">Flame Thrower</option>
  </select>
  <label>🔫 SECONDARY 2</label>
  <select id="secondary2" onchange="updateAll()">
    <option value="none" selected>None</option>
    <option value="browning">M2 Browning (.50 cal)</option>
    <option value="dt">DT Machine Gun (Soviet)</option>
    <option value="smoke">Smoke Launcher</option>
  </select>
  <label>🔫 SECONDARY 3</label>
  <select id="secondary3" onchange="updateAll()">
    <option value="none" selected>None</option>
    <option value="at_rifle">AT Rifle</option>
    <option value="mortar">Light Mortar</option>
    <option value="rocket">Rocket Pod</option>
  </select>
  <label>⚙️ ENGINE</label>
  <select id="engine" onchange="updateAll()">
    <option value="weak">Weak (Gasoline)</option>
    <option value="medium" selected>Medium (Diesel)</option>
    <option value="strong">Strong (Maybach)</option>
    <option value="experimental">Experimental (Jet Fuel)</option>
  </select>
  <label>⛽ FUEL TYPE</label>
  <select id="fuel" onchange="updateAll()">
    <option value="gasoline" selected>Gasoline (Cheap, Flammable)</option>
    <option value="diesel">Diesel (Safe, Less Power)</option>
    <option value="aviation">Aviation Fuel (Fast, Explosive)</option>
    <option value="electric">Electric (Silent, Heavy Battery)</option>
  </select>
  <label>🛡️ ARMOR ADDON</label>
  <select id="armorAddon" onchange="updateAll()">
    <option value="none" selected>None</option>
    <option value="skirts">Side Skirts (+15 Armor)</option>
    <option value="spaced">Spaced Armor (+20 Armor)</option>
    <option value="cage">Cage Armor (+10 vs AT)</option>
    <option value="sandbags">Sandbags (+8 Cheap Armor)</option>
  </select>
  <label>🔩 MATERIAL</label>
  <select id="material" onchange="updateAll()">
    <option value="steel" selected>Rolled Steel (Standard)</option>
    <option value="cast">Cast Iron (Cheap, Heavy)</option>
    <option value="alloy">Alloy Steel (Light, Expensive)</option>
    <option value="composite">Composite (Prototype)</option>
  </select>
  <label>🎨 CAMOUFLAGE</label>
  <select id="camo" onchange="updateAll()">
    <option value="grey" selected>Panzer Grey (1940)</option>
    <option value="yellow">Dunkelgelb (1943)</option>
    <option value="white">Winter Whitewash</option>
    <option value="olive">Olive Drab (Allied)</option>
    <option value="desert">Desert Tan (Afrika)</option>
  </select>
  <hr>
  <div id="stats"></div>
  <hr>
  <div id="hoi4stats"></div>
  <hr>
  <button id="createTank" class="enter-btn" onclick="createTank()">📋 CREATE TANK</button>
</div>

<div id="specSheet" style="display:none;">
  <div id="specContent"></div>
  <button onclick="document.getElementById('specSheet').style.display='none'" style="margin-top:10px; padding:8px 20px; background:#b33a2e; color:white; border:none; border-radius:4px; cursor:pointer;">CLOSE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ========== TANK MODEL ==========
const tankURL = "https://whyhelpwhenyoucanhelp-stack.github.io/tank-models-br/Tank.glb";

let scene, camera, renderer, tank;
let rotX = 0, rotY = 0, zoom = 14;
let dragging = false, lastX = 0, lastY = 0;

const chassisStats = {
  light:{speed:60,armor:15,weight:9,cost:80,reliability:80,name:"Light Tank (Pz II)"},
  medium:{speed:45,armor:30,weight:25,cost:120,reliability:75,name:"Medium Tank (Pz IV)"},
  heavy:{speed:35,armor:60,weight:55,cost:200,reliability:65,name:"Heavy Tank (Tiger I)"},
  superheavy:{speed:20,armor:100,weight:188,cost:400,reliability:40,name:"Super Heavy (Maus)"},
  td:{speed:40,armor:50,weight:24,cost:150,reliability:70,name:"Tank Destroyer (StuG)"},
  spg:{speed:35,armor:15,weight:11,cost:100,reliability:60,name:"SPG (Wespe)"}
};

const turretMods = {
  none:{weight:0,cost:0,armor:0,speed:0,name:"No Turret"},
  light:{weight:2,cost:30,armor:5,speed:-2,name:"Light Turret"},
  medium:{weight:5,cost:60,armor:10,speed:-5,name:"Medium Turret"},
  heavy:{weight:10,cost:120,armor:20,speed:-8,name:"Heavy Turret"},
  aa:{weight:3,cost:80,armor:3,speed:-3,name:"AA Turret"}
};

const primaryMods = {
  "20mm":{firepower:20,pen:25,weight:1,speed:0,cost:20,name:"20mm Auto Cannon"},
  "37mm":{firepower:37,pen:45,weight:2,speed:-1,cost:35,name:"37mm Cannon"},
  "50mm":{firepower:50,pen:60,weight:3,speed:-2,cost:50,name:"50mm Cannon"},
  "75mm":{firepower:75,pen:90,weight:5,speed:-3,cost:80,name:"75mm Cannon"},
  "88mm":{firepower:88,pen:120,weight:8,speed:-5,cost:120,name:"88mm Cannon"},
  "105mm":{firepower:105,pen:100,weight:10,speed:-6,cost:150,name:"105mm Howitzer"},
  "128mm":{firepower:128,pen:160,weight:14,speed:-8,cost:200,name:"128mm Heavy"},
  "150mm":{firepower:150,pen:130,weight:18,speed:-10,cost:280,name:"150mm Siege Gun"}
};

const secondaryMods = {
  none:{firepower:0,weight:0,cost:0,name:"None"},
  mg34:{firepower:8,weight:0.3,cost:15,name:"MG34 Coaxial"},
  mg42:{firepower:10,weight:0.4,cost:20,name:"MG42 Hull"},
  flame:{firepower:25,weight:1,cost:40,name:"Flame Thrower"},
  browning:{firepower:12,weight:0.5,cost:25,name:"M2 Browning"},
  dt:{firepower:7,weight:0.3,cost:12,name:"DT MG"},
  smoke:{firepower:0,weight:0.2,cost:10,name:"Smoke Launcher"},
  at_rifle:{firepower:15,weight:0.6,cost:30,name:"AT Rifle"},
  mortar:{firepower:20,weight:2,cost:35,name:"Light Mortar"},
  rocket:{firepower:30,weight:1.5,cost:60,name:"Rocket Pod"}
};

const engineMods = {
  weak:{speed:0,reliability:5,cost:0,name:"Weak Gasoline"},
  medium:{speed:8,reliability:10,cost:30,name:"Medium Diesel"},
  strong:{speed:15,reliability:-5,cost:80,name:"Maybach Power"},
  experimental:{speed:25,reliability:-20,cost:150,name:"Jet Fuel Experimental"}
};

const fuelMods = {
  gasoline:{speed:2,reliability:-5,cost:0,name:"Gasoline"},
  diesel:{speed:-2,reliability:15,cost:10,name:"Diesel"},
  aviation:{speed:10,reliability:-15,cost:40,name:"Aviation Fuel"},
  electric:{speed:-5,reliability:20,cost:60,name:"Electric Battery"}
};

const armorAddonMods = {
  none:{armor:0,weight:0,speed:0,cost:0,name:"None"},
  skirts:{armor:15,weight:3,speed:-3,cost:40,name:"Side Skirts"},
  spaced:{armor:20,weight:5,speed:-5,cost:70,name:"Spaced Armor"},
  cage:{armor:10,weight:2,speed:-1,cost:30,name:"Cage Armor"},
  sandbags:{armor:8,weight:4,speed:-2,cost:5,name:"Sandbags"}
};

const materialMods = {
  steel:{armorMul:1.0,weightMul:1.0,costMul:1.0,name:"Rolled Steel"},
  cast:{armorMul:0.8,weightMul:1.3,costMul:0.6,name:"Cast Iron"},
  alloy:{armorMul:1.2,weightMul:0.8,costMul:2.0,name:"Alloy Steel"},
  composite:{armorMul:1.5,weightMul:1.1,costMul:3.0,name:"Composite Prototype"}
};

const musicFrame = document.getElementById('bgMusic');
musicFrame.src = "https://www.youtube.com/embed/5AsV9UvLd5E?autoplay=1&loop=1&playlist=5AsV9UvLd5E";
let musicPlaying = true;
document.getElementById('toggleMusic').addEventListener('click', () => {
  musicPlaying = !musicPlaying;
  musicFrame.src = musicPlaying ? "https://www.youtube.com/embed/5AsV9UvLd5E?autoplay=1&loop=1&playlist=5AsV9UvLd5E" : "";
});

let currentSlide = 0;
const slides = document.querySelectorAll('.menu-slide');
const dots = document.querySelectorAll('.dot');
const slider = document.getElementById('menuSlider');
function goToSlide(i) {
  currentSlide = i;
  slider.style.transform = `translateX(-${i * 100}%)`;
  slides.forEach((s, j) => s.classList.toggle('active', j === i));
  dots.forEach((d, j) => d.classList.toggle('active', j === i));
}
document.getElementById('prevSlide').addEventListener('click', () => { if (currentSlide > 0) goToSlide(currentSlide - 1); });
document.getElementById('nextSlide').addEventListener('click', () => { if (currentSlide < 2) goToSlide(currentSlide + 1); });
dots.forEach(d => d.addEventListener('click', () => goToSlide(parseInt(d.dataset.index))));

const pc = document.getElementById('particles');
for (let i = 0; i < 50; i++) {
  const p = document.createElement('div'); p.classList.add('particle');
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDelay = Math.random() * 4 + 's';
  p.style.animationDuration = (3 + Math.random() * 5) + 's';
  pc.appendChild(p);
}

document.getElementById('startButton').addEventListener('click', () => {
  document.getElementById('startMenu').style.display = 'none';
  document.getElementById('ui').style.display = 'block';
});
document.addEventListener('keydown', (e) => {
  if (document.getElementById('startMenu').style.display !== 'none') {
    if (e.key === 'ArrowRight' && currentSlide < 2) goToSlide(currentSlide + 1);
    if (e.key === 'ArrowLeft' && currentSlide > 0) goToSlide(currentSlide - 1);
  }
});

init();
animate();
updateAll();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, zoom);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff, 1.8));
  const l1 = new THREE.DirectionalLight(0xffffff, 1.5); l1.position.set(5, 10, 5); scene.add(l1);
  const l2 = new THREE.DirectionalLight(0xffaa88, 0.8); l2.position.set(-3, 2, -2); scene.add(l2);
  scene.add(new THREE.GridHelper(10, 20, 0x333333, 0x222222));
  const loader = new THREE.GLTFLoader();
  loader.load(tankURL,
    (gltf) => {
      tank = gltf.scene;
      const box = new THREE.Box3().setFromObject(tank);
      const size = box.getSize(new THREE.Vector3());
      tank.scale.set(4 / Math.max(size.x, size.y, size.z), 4 / Math.max(size.x, size.y, size.z), 4 / Math.max(size.x, size.y, size.z));
      tank.position.set(0, 0, 0);
      scene.add(tank);
    },
    (p) => { if (p.total) console.log("Loading:", Math.round(p.loaded / p.total * 100) + "%"); },
    () => {
      const g = new THREE.Group();
      const h = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.8, 4), new THREE.MeshStandardMaterial({ color: 0x4a5d23 })); h.position.y = 0.5; g.add(h);
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0x3a4d18 })); t.position.set(0, 1.1, -0.3); g.add(t);
      tank = g; scene.add(tank);
    }
  );
  document.addEventListener("mousedown", () => dragging = true);
  document.addEventListener("mouseup", () => dragging = false);
  document.addEventListener("mousemove", (e) => {
    if (dragging && tank) { rotY += (e.clientX - lastX) * 0.005; rotX += (e.clientY - lastY) * 0.005; }
    lastX = e.clientX; lastY = e.clientY;
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "PageUp") { zoom = Math.max(4, zoom - 1); camera.position.z = zoom; }
    if (e.key === "PageDown") { zoom = Math.min(30, zoom + 1); camera.position.z = zoom; }
  });
  window.addEventListener("resize", () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
}

function animate() {
  requestAnimationFrame(animate);
  if (tank) { tank.rotation.y = rotY; tank.rotation.x = rotX; }
  renderer.render(scene, camera);
}

function getVal(id) { return document.getElementById(id).value; }

function updateAll() {
  const c = chassisStats[getVal("chassis")];
  const t = turretMods[getVal("turret")];
  const p = primaryMods[getVal("primaryWeapon")];
  const s1 = secondaryMods[getVal("secondary1")];
  const s2 = secondaryMods[getVal("secondary2")];
  const s3 = secondaryMods[getVal("secondary3")];
  const e = engineMods[getVal("engine")];
  const f = fuelMods[getVal("fuel")];
  const a = armorAddonMods[getVal("armorAddon")];
  const m = materialMods[getVal("material")];
  let armor = (c.armor + t.armor + a.armor) * m.armorMul;
  let speed = c.speed + t.speed + p.speed + e.speed + f.speed + a.speed;
